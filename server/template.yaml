AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  No-Waste-Bro API - FastAPI on AWS Lambda behind API Gateway (HTTP API).
  Build the code first with ./scripts/build_lambda.sh, then sam deploy.

Parameters:
  SupabaseUrl:
    Type: String
    Default: https://vvhwqamejfaouvfmkhps.supabase.co
    Description: Supabase project URL
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Description: Supabase service role key (bypasses RLS). Pass it with --parameter-overrides on every deploy, never store it in samconfig.toml
  DemoDate:
    Type: String
    Default: ""
    Description: (optional) Pin the system's "today" for demos, format YYYY-MM-DD. Empty = current date in Asia/Bangkok
  CorsOrigins:
    Type: String
    Default: "*"
    Description: Browser origins allowed to call the API, comma-separated
  WorkerImageUri:
    Type: String
    Description: ECR image of the AI pipeline worker, printed by AI/pipeline/build_worker.sh
  WorkerApiBaseUrl:
    Type: String
    Default: https://yu00jk24pk.execute-api.ap-southeast-1.amazonaws.com/api/v1
    Description: API the worker calls (= Outputs.ApiBaseUrl of this stack; it stays the same across sam deploy)
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Region of the Bedrock models and Knowledge Base used by the LLM Task Agent
  BedrockKnowledgeBaseId:
    Type: String
    Default: N0NJ2UIEIU
    Description: Bedrock Knowledge Base with the store SOPs

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: No-Waste-Bro FastAPI app (Mangum adapter)
      CodeUri: build/                 # created by scripts/build_lambda.sh
      Handler: main.handler           # handler = Mangum(app) in main.py
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 29                     # API Gateway HTTP API cuts requests at 30 seconds
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          DEMO_DATE: !Ref DemoDate
          CORS_ORIGINS: !Ref CorsOrigins
          PIPELINE_FUNCTION_NAME: !Ref PipelineWorkerFunction
          AGENT_FUNCTION_NAME: !Ref ManagerAgentFunction
      Policies:
        - LambdaInvokePolicy:          # POST /ai/pipeline-runs starts the worker (async)
            FunctionName: !Ref PipelineWorkerFunction
        - LambdaInvokePolicy:          # POST /agent/ask waits for the Manager Agent (sync)
            FunctionName: !Ref ManagerAgentFunction
      Events:
        AllRoutes:                    # every method and path goes to FastAPI, which picks the route
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  # Create the log group ourselves so sam delete removes it too (and old logs expire)
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  # AI pipeline worker: Risk Scanner -> Optimizer -> LLM Task Agent (AI/pipeline/)
  # Container image: the AI libraries (LightGBM, pandas, scipy) are too big for a zip Lambda
  PipelineWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: No-Waste-Bro AI pipeline worker (invoked async by POST /ai/pipeline-runs)
      PackageType: Image
      ImageUri: !Ref WorkerImageUri
      Architectures:
        - arm64
      MemorySize: 3008
      Timeout: 900                    # Lambda maximum (15 minutes)
      EphemeralStorage:
        Size: 1024
      EventInvokeConfig:
        MaximumRetryAttempts: 0       # a retry would scan / post twice; start a new run instead
      Environment:
        Variables:
          API_BASE_URL: !Ref WorkerApiBaseUrl   # not !Sub ${ServerlessHttpApi}: that would be a circular dependency
          DEMO_DATE: !Ref DemoDate
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_KB_ID: !Ref BedrockKnowledgeBaseId
          WORK_DIR: /tmp/pipeline
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${BedrockRegion}::foundation-model/amazon.nova-lite-v1:0
                - !Sub arn:aws:bedrock:${BedrockRegion}::foundation-model/qwen.qwen3-next-80b-a3b
            - Effect: Allow
              Action: bedrock:Retrieve
              Resource: !Sub arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:knowledge-base/${BedrockKnowledgeBaseId}

  PipelineWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PipelineWorkerFunction}
      RetentionInDays: 14

  # Manager Agent: chat for the web dashboard (read-only tools + Optimizer what-if), same image as the worker
  ManagerAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: No-Waste-Bro Manager Agent (invoked sync by POST /agent/ask)
      PackageType: Image
      ImageUri: !Ref WorkerImageUri
      ImageConfig:
        Command: ["manager_agent.handler.lambda_handler"]
      Architectures:
        - arm64
      MemorySize: 2048
      Timeout: 30                     # the agent stops itself at 25 s; the API waits 27 s
      EventInvokeConfig:
        MaximumRetryAttempts: 0       # only the warm-up ping is async
      Environment:
        Variables:
          API_BASE_URL: !Ref WorkerApiBaseUrl
          DEMO_DATE: !Ref DemoDate
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_KB_ID: !Ref BedrockKnowledgeBaseId
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${BedrockRegion}::foundation-model/amazon.nova-lite-v1:0
                - !Sub arn:aws:bedrock:${BedrockRegion}::foundation-model/qwen.qwen3-next-80b-a3b
            - Effect: Allow
              Action: bedrock:Retrieve
              Resource: !Sub arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:knowledge-base/${BedrockKnowledgeBaseId}

  ManagerAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ManagerAgentFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the API (stays the same across sam deploy; changes after sam delete)
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiBaseUrl:
    Description: Value for the mobile app's --dart-define=API_BASE_URL
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/v1
  DocsUrl:
    Description: Swagger UI
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/docs
  FunctionName:
    Description: Lambda function name
    Value: !Ref ApiFunction
  PipelineWorkerName:
    Description: AI pipeline worker Lambda (logs in CloudWatch under /aws/lambda/<name>)
    Value: !Ref PipelineWorkerFunction
  ManagerAgentName:
    Description: Manager Agent Lambda (logs in CloudWatch under /aws/lambda/<name>)
    Value: !Ref ManagerAgentFunction
